<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon/icon-192.png">
<link rel="apple-touch-icon" href="icon/icon-192.png">
<title>バトルシップ</title>
<style>
:root{
  --bg:#F6F1E4; --panel:#FBF8F0; --line:#D8CFB8; --line2:#EAE2CD;
  --ink:#241F14; --sub:#6B6350; --navy:#1F4E79; --navy-d:#163A5B;
  --warn:#8A5A00; --err:#A22C2C; --ok:#2C6E3F;
  --sea:#DCE8F1; --sea-d:#C9DBE9; --ship:#6E7B87; --hit:#C0392B; --miss:#8FA6B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  font-size:14px;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;font-size:14px;cursor:pointer}
select,input{font-family:inherit;font-size:15px;color:var(--ink)}
[hidden]{display:none !important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* ---- ヘッダ ---- */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
header h1{margin:0;font-size:17px;color:var(--navy)}
#logo{height:30px;display:none}
header .sub{font-size:11.5px;color:var(--sub);line-height:1.3}
header .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;padding:0}

/* ---- 指示の帯 ---- */
#guide{padding:8px 12px;font-weight:700;color:var(--navy);font-size:14px;line-height:1.5;
  background:#FDFBF4;border-bottom:1px solid var(--line2)}
#guide.warn{color:var(--warn)} #guide.win{color:var(--ok)} #guide.lose{color:var(--err)}
#guideSub{display:block;font-weight:400;font-size:12px;color:var(--sub)}

/* ---- 盤 ---- */
main{flex:1;padding:8px 8px 0}
.slot-head{display:flex;align-items:baseline;gap:8px;margin:4px 2px 4px}
.slot-head b{font-size:14px}
.slot-head span{font-size:12px;color:var(--sub)}
#bigSlot{--cell:min(34px, calc((min(100vw, 560px) - 16px - 20px) / 10))}  /* 高さに収まらないときは fitBoard() が縮める */
#smallSlot{--cell:17px}
#bigSlot .grid{width:max-content;margin:0 auto}   /* 縮めたときは真ん中に */
.grid{display:grid;grid-template-columns:20px repeat(10,var(--cell));grid-template-rows:18px repeat(10,var(--cell));
  user-select:none;-webkit-user-select:none}
#smallSlot .grid{grid-template-columns:14px repeat(10,var(--cell));grid-template-rows:11px repeat(10,var(--cell))}
.grid .lb{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px}
#smallSlot .grid .lb{font-size:8px}
.grid .lb.top{height:18px}
#smallSlot .grid .lb.top{height:11px}
.grid .c{background:var(--sea);border:1px solid #fff;display:flex;align-items:center;justify-content:center;
  position:relative;font-weight:700;font-size:calc(var(--cell) * .5)}
.grid .c.ship{background:var(--ship)}
.grid .c.reveal{background:#B7C0C8}
.grid .c.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--miss)}
.grid .c.hit{background:#E9B7B0}
.grid .c.ship.hit{background:#8E4A43}
.grid .c.hit::after{content:"×";color:var(--hit);line-height:1}
.grid .c.ship.hit::after{color:#fff}
body:not(.theme-img) .grid .c.sunk{background:#5A1F1A !important}
.grid .c.sunk::after{color:#F3C9C3}
.grid .c.pv{background:#7FB08A !important;outline:2px solid #3E7B4C;outline-offset:-2px}
.grid .c.pv.ng{background:#E1A09A !important;outline-color:var(--err)}
.grid .c.aim{outline:3px solid #F0B400;outline-offset:-3px;background:#F6D98B !important}
.grid .c.last{box-shadow:inset 0 0 0 2px #F0B400}
#smallWrap{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
#smallWrap .fleets{flex:1;min-width:0}

/* ---- 艦隊 ---- */
.fleet{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:4px 8px;margin-bottom:5px}
.fleet h3{margin:0 0 3px;font-size:11px;color:var(--sub);font-weight:400}
.fleet ul{list-style:none;margin:0;padding:0}
.fleet li{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.3;padding:0}
.fleet .nm{width:42px}
.fleet .pips{display:flex;gap:2px}
.fleet .pips i{width:9px;height:9px;border-radius:2px;background:var(--ship);display:block}
.fleet .pips i.h{background:var(--hit)} .fleet .pips i.u{background:var(--line2)}
.fleet li.sunk .nm{text-decoration:line-through;color:var(--sub)}
.fleet li.todo .nm{color:var(--sub)} .fleet li.now .nm{color:var(--navy);font-weight:700}

/* ---- 記録 ---- */
details.log{margin:8px 0 0;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
details.log summary{padding:8px 10px;font-size:12.5px;color:var(--sub)}
#log{list-style:none;margin:0;padding:0 10px 8px;font-size:12.5px;line-height:1.7;max-height:40vh;overflow:auto}
#log li{border-bottom:1px dotted var(--line2)}
#log li.hit{color:var(--hit)} #log li.sunk{color:var(--hit);font-weight:700} #log li.sys{color:var(--navy);font-weight:700}

/* ---- 下の操作帯 ---- */
#acts{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#acts .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
#acts button{flex:1;min-height:52px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:15px}
#acts button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
#acts button:disabled{opacity:.45}

/* ---- ⚙ ---- */
.mask{position:fixed;inset:0;z-index:50;background:rgba(36,31,20,.45);display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
.row{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.row > label{font-size:12.5px;color:var(--sub)}
.row select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 0;color:var(--sub)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.note{font-size:11.5px;color:var(--sub);margin:0}
.sheet .btns{display:flex;gap:8px;margin-top:6px}
.sheet .btns button{flex:1;min-height:46px;border-radius:8px;border:1px solid var(--line);background:#fff}
.sheet .btns button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.sheet .btns button.danger{color:var(--err);border-color:#D9BDBD}
#statsBox{font-size:13px;line-height:1.8;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 10px}

/* ---- ［画像］表示（PC版と同じ素材 images/） ---- */
body.theme-img #logo{display:block}
body.theme-img header h1{display:none}
body.theme-img main{background:#0E2A45 url(images/warship.jpg) center top/cover no-repeat}
body.theme-img .slot-head b,body.theme-img .slot-head span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
body.theme-img .grid .lb{color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9)}
body.theme-img .grid .c{background:rgba(10,40,70,.42);border:1px solid rgba(255,255,255,.35)}
body.theme-img .grid .c.hit{background:rgba(150,30,20,.45)}
body.theme-img .grid .c.reveal{opacity:.6}
body.theme-img .grid .c.hit::after{content:"";width:60%;height:60%;background:url(images/Hit.gif) center/contain no-repeat;position:relative;z-index:1}
body.theme-img .grid .c.miss::after{width:45%;height:45%;border-radius:0;background:url(images/Miss.gif) center/contain no-repeat}
body.theme-img .grid .c.sunk::before{content:"";position:absolute;inset:0;background:rgba(110,0,0,.45)}
body.theme-img .fleet,body.theme-img details.log{background:rgba(251,248,240,.93)}
#splash{position:fixed;z-index:40;pointer-events:none;opacity:0;transform:scale(.6);
  transition:opacity .15s, transform .2s;max-width:62vw;max-height:30vh}
#splash.on{opacity:1;transform:scale(1)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#241F14;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;
  transition:.18s;z-index:60;max-width:90vw}
#toast.on{opacity:.94}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>バトルシップ</h1><img id="logo" src="images/Battleship.gif" alt="Battleship">
  <div class="sub"><span id="ver"></span><br><span id="stats"></span></div>
  <span class="sp"></span>
  <button class="ic" id="bSet" title="設定">⚙</button>
</header>
<div id="guide">⚙で相手を選んで［新しく始める］を押してください<span id="guideSub"></span></div>
<main>
  <div class="slot-head"><b id="bigTitle">－</b><span id="bigWho"></span></div>
  <div id="bigSlot"></div>
  <div id="smallWrap">
    <div>
      <div class="slot-head"><b id="smallTitle">－</b></div>
      <div id="smallSlot"></div>
    </div>
    <div class="fleets" id="fleets"></div>
  </div>
  <details class="log"><summary id="logSum">戦況の記録</summary><ul id="log"></ul></details>
</main>
</div>

<div id="acts"><div class="in" id="actsIn"></div></div>

<div class="mask" id="mSet"><div class="sheet">
  <h2>設定</h2>
  <div class="row"><label for="selAi">対戦相手（次の対戦から）</label>
    <select id="selAi">
      <option value="random">Random（手当たり次第）</option>
      <option value="fairplay">FairPlay（見つけたら沈める）</option>
      <option value="merciless">Merciless（手加減なし）</option>
    </select></div>
  <div class="row"><label>自分の盤（次の対戦から。グリッド1が先に撃つ）</label>
    <div class="seg" id="segGrid"><button data-v="1">グリッド1（先攻）</button><button data-v="2">グリッド2（後攻）</button></div></div>
  <div class="row"><label>表示</label>
    <div class="seg" id="segTheme"><button data-v="std">標準</button><button data-v="img">画像</button></div></div>
  <div class="row"><label>音</label>
    <div class="seg" id="segSound"><button data-v="1">入</button><button data-v="0">切</button></div>
    <label for="rngVol">音の大きさ <span id="volVal"></span></label>
    <input type="range" id="rngVol" min="0" max="100" step="5"></div>
  <div class="row"><label for="selDelay">相手が撃つまでの間</label>
    <select id="selDelay">
      <option value="0">すぐ</option><option value="400">短め（0.4秒）</option>
      <option value="700">ふつう（0.7秒）</option><option value="1200">ゆっくり（1.2秒）</option>
    </select></div>
  <div class="row"><label>戦績</label><div id="statsBox"></div></div>
  <div class="btns"><button id="bHistory">過去の対戦を見る</button><button class="danger" id="bClear">戦績を消す</button></div>
  <p class="note" style="margin-top:10px">バトルシップ スマホ版 <span id="ver2"></span>。記録と設定はこのスマホのブラウザの中にだけ残ります。</p>
  <div class="btns"><button id="bClose">閉じる</button><button class="primary" id="bNew2">新しく始める</button></div>
</div></div>

<div id="toast"></div>
<img id="splash" alt="">

<script>
/* ======================================================================
   バトルシップ スマホ版（PWA）
     ゲームの中身（ルール・3つのAI・音）は PC版 battleship.html と同じもの。
     違うのは画面と操作だけ：
       ・大きい盤＝いま見るべき盤（配置中と相手の番は自分の盤、自分の番は相手の盤）
       ・配置はタップで仮置き →［回転］→［確定］、攻撃はタップで狙う →［撃つ］
       ・設定は ⚙。戦績と設定は localStorage（名前は battleship_android_ で始める）
   ====================================================================== */
const APP_VERSION="1.1.1";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,ms){ const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), ms||2200); }

/* ---------------- 定数 ---------------- */
const N=10;
const COLS='ABCDEFGHIJ';
const H='H', V='V';
const UNKNOWN=-1, MISS=3, HIT=4;
const SHIPS=[                 // VBA の Ship.cls と同じ並び・長さ
  {kind:'carrier',    name:'空母',   en:'Aircraft Carrier', size:5},
  {kind:'battleship', name:'戦艦',   en:'Battleship',       size:4},
  {kind:'submarine',  name:'潜水艦', en:'Submarine',        size:3},
  {kind:'cruiser',    name:'巡洋艦', en:'Cruiser',          size:3},
  {kind:'destroyer',  name:'駆逐艦', en:'Destroyer',        size:2},
];
const AI_NAMES={random:'Random', fairplay:'FairPlay', merciless:'Merciless'};
const pos=(x,y)=>({x,y});
const label=p=>COLS[p.x-1]+p.y;

let CFG={ai_delay_ms:700, fire_by:'double', default_ai:'merciless', default_grid:'1', default_theme:'std', default_sound:true, sound_volume:70};

/* ---------------- 盤（PlayerGrid） ---------------- */
class Grid{
  constructor(id){
    this.id=id; this.ships=[];
    this.state=[]; for(let x=0;x<=N+1;x++){ this.state.push(new Array(N+2).fill(UNKNOWN)); }
  }
  inside(x,y){ return x>=1 && x<=N && y>=1 && y<=N; }
  // 盤の外は 0（VBA の On Error Resume Next で返っていた既定値）
  st(x,y){ return this.inside(x,y) ? this.state[x][y] : 0; }
  cellsOf(x,y,dir,size){
    const out=[]; for(let i=0;i<size;i++) out.push(pos(x+(dir===H?i:0), y+(dir===V?i:0)));
    return out;
  }
  shipAt(x,y){ return this.ships.find(s=>s.cells.some(c=>c.x===x&&c.y===y)) || null; }
  canAdd(x,y,dir,size){
    return this.cellsOf(x,y,dir,size).every(c=>this.inside(c.x,c.y) && !this.shipAt(c.x,c.y));
  }
  // 上下左右・斜めのどこかに他の艦があるか（VBA: HasAdjacentShip / IsAdjacent）
  hasAdjacentShip(x,y,dir,size){
    return this.cellsOf(x,y,dir,size).some(c=>{
      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
        if(!dx && !dy) continue;
        if(this.shipAt(c.x+dx, c.y+dy)) return true;
      }
      return false;
    });
  }
  add(def,x,y,dir){
    const s={kind:def.kind, name:def.name, en:def.en, size:def.size, x, y, dir,
             cells:this.cellsOf(x,y,dir,def.size).map(c=>({x:c.x,y:c.y,hit:false}))};
    this.ships.push(s); return s;
  }
  isSunk(s){ return s.cells.every(c=>c.hit); }
  damaged(s){ return !this.isSunk(s) && s.cells.some(c=>c.hit); }
  tryHit(x,y){
    const s=this.shipAt(x,y);
    if(s){
      s.cells.find(c=>c.x===x&&c.y===y).hit=true;
      this.state[x][y]=HIT;
      return {result:this.isSunk(s)?'sunk':'hit', ship:s};
    }
    this.state[x][y]=MISS;
    return {result:'miss', ship:null};
  }
  // その位置が「当たったが沈んでいない艦」の上か（VBA: HasDamagedShip）
  hasDamagedShip(x,y){ const s=this.shipAt(x,y); return !!s && this.damaged(s); }
  // 沈んでいない艦のうち最小の長さ（VBA: SmallestShipSize）
  smallestShipSize(){
    const a=this.ships.filter(s=>!this.isSunk(s)).map(s=>s.size);
    return a.length ? Math.min(...a) : 2;
  }
  // 沈んでいない艦の、最初の「連続した命中の塊」（VBA: FindHitArea / HitAreas(1)）
  findHitArea(){
    for(const s of this.ships){
      if(this.isSunk(s)) continue;
      let cur=[];
      for(const c of s.cells){
        if(c.hit) cur.push(pos(c.x,c.y));
        else if(cur.length) return cur;
      }
      if(cur.length) return cur;
    }
    return null;
  }
  allSunk(){ return this.ships.length===SHIPS.length && this.ships.every(s=>this.isSunk(s)); }
}

/* ---------------- 乱数（VBA: GameRandomizer） ---------------- */
const P={AlmostNever:0.1, Rarely:0.25, Sometimes:0.5};
const R={
  between:(a,b)=>Math.floor(Math.random()*(b-a+1))+a,
  maybe:p=>Math.random()<p,
};

/* ---------------- AI（VBA: GameStrategyBase ＋ 3つの戦い方） ---------------- */
const Base={
  placeShip(g,size){
    for(;;){
      const x=R.between(1,N);
      const dir = (x+size-1>N) ? V : (R.maybe(P.Sometimes)?H:V);
      const y = dir===H ? R.between(1,N) : R.between(1,N-size+1);
      if(g.canAdd(x,y,dir,size)) return {x,y,dir};
    }
  },
  shootRandom(g){
    for(;;){ const p=pos(R.between(1,N),R.between(1,N)); if(this.isLegal(g,p)) return p; }
  },
  isLegal(g,p){ return !!p && g.inside(p.x,p.y) && g.st(p.x,p.y)!==HIT && g.st(p.x,p.y)!==MISS; },
  destroyTarget(g,area){
    return this.inferDir(area)===H ? this.findH(g,area) : this.findV(g,area);
  },
  inferDir(area){
    if(area.length<2) return R.maybe(P.Sometimes)?H:V;
    return area[1].y===area[0].y ? H : V;
  },
  findH(g,area){
    const L=area.reduce((m,c)=>c.x<m.x?c:m), Rt=area.reduce((m,c)=>c.x>m.x?c:m);
    let r;
    if(R.maybe(P.Sometimes)){
      r=L; if(r.x>1) r=pos(r.x-1,r.y);
      if(r.x<1 || g.st(r.x,r.y)===MISS) r=pos(Rt.x+1,Rt.y);
    }else{
      r=Rt; if(r.x<N) r=pos(r.x+1,r.y);
      if(r.x>N || g.st(r.x,r.y)===MISS) r=pos(L.x-1,L.y);
    }
    return r;
  },
  findV(g,area){
    const T=area.reduce((m,c)=>c.y<m.y?c:m), B=area.reduce((m,c)=>c.y>m.y?c:m);
    let r;
    if(R.maybe(P.Sometimes)){
      r=T; if(r.y>1) r=pos(r.x,r.y-1);
      if(r.y<1 || g.st(r.x,r.y)===MISS) r=pos(B.x,B.y+1);
    }else{
      r=B; if(r.y<N) r=pos(r.x,r.y+1);
      if(r.y>N || g.st(r.x,r.y)===MISS) r=pos(T.x,T.y-1);
    }
    return r;
  },
  // 残っている最小の艦が、その位置に縦か横で収まるか（VBA: VerifyShipFits）
  shipFits(g,p,n){
    if(g.hasDamagedShip(p.x,p.y)) return true;
    const run=(dx,dy)=>{
      for(let i=0;i<n;i++){ const x=p.x+dx*i, y=p.y+dy*i;
        if(!g.inside(x,y) || g.st(x,y)!==UNKNOWN) return false; }
      return true;
    };
    return run(1,0)||run(-1,0)||run(0,1)||run(0,-1);
  },
};

/* 迷子の保険：条件がどうしても満たせないとき、ここで打ち切って空いている所を撃つ。
   VBA 版は条件が満たせるまで回り続けるが、画面が固まるのを避けるため上限を置いた。 */
const LOOP_MAX=3000;

function makeAI(kind){
  const ai={kind, name:AI_NAMES[kind]};
  const avoidAdjacent=kind!=='random';

  ai.placeAll=g=>{
    for(const def of SHIPS){
      let p, n=0;
      do{ p=Base.placeShip(g,def.size); n++; }
      while(avoidAdjacent && g.hasAdjacentShip(p.x,p.y,p.dir,def.size)
            && !R.maybe(P.AlmostNever) && n<LOOP_MAX);
      g.add(def,p.x,p.y,p.dir);
    }
  };

  if(kind==='random'){
    // 手当たり次第に撃ち、敵の艦をすべて見つけてから沈めにかかる
    ai.play=g=>{
      for(let i=0;i<LOOP_MAX;i++){
        const toFind=g.ships.filter(s=>!s.cells.some(c=>c.hit)).length;
        let p;
        if(toFind>0) p=Base.shootRandom(g);
        else { const a=g.findHitArea(); p = a ? Base.destroyTarget(g,a) : Base.shootRandom(g); }
        if(Base.isLegal(g,p)) return p;
      }
      return Base.shootRandom(g);
    };
  }else if(kind==='fairplay'){
    // 手当たり次第に撃ち、1隻見つけたら沈めるまで攻める
    ai.play=g=>{
      for(let i=0;i<LOOP_MAX;i++){
        const a=g.findHitArea();
        const p = a ? Base.destroyTarget(g,a) : Base.shootRandom(g);
        if(Base.isLegal(g,p)) return p;
      }
      return Base.shootRandom(g);
    };
  }else{
    // 中央か端を型どおりに探り、見つけたら沈める。最小の艦が入らない所は撃たない。
    let centerLast=null, edgeLast=null, lastEdge=0;
    const scanCenter=g=>{
      let p=null;
      for(let it=0; it<LOOP_MAX; it++){
        if(it<10){
          if(!centerLast){ p=pos(R.between(3,8),R.between(3,8)); }
          else if(g.st(centerLast.x,centerLast.y)===UNKNOWN){ centerLast=null; p=null; }
          else{
            p=pos(centerLast.x+(R.maybe(P.Sometimes)?1:-1), centerLast.y+(R.maybe(P.Sometimes)?1:-1));
            if(p.x<3||p.x>8||p.y<3||p.y>8) centerLast=pos(R.between(3,8),R.between(3,8));
          }
        }else p=Base.shootRandom(g);
        if(Base.isLegal(g,p)) break;
      }
      centerLast=p; return p;
    };
    const scanEdges=g=>{
      let p=null;
      for(let it=0; it<LOOP_MAX; it++){
        if(it<10){
          if(!edgeLast){
            if(R.maybe(P.Sometimes)){
              if(R.maybe(P.Sometimes)){ lastEdge=0; p=pos(R.between(1,2),R.between(1,N)); }
              else                    { lastEdge=2; p=pos(R.between(9,10),R.between(1,N)); }
            }else{
              if(R.maybe(P.Sometimes)){ lastEdge=1; p=pos(R.between(1,N),R.between(1,2)); }
              else                    { lastEdge=3; p=pos(R.between(1,N),R.between(9,10)); }
            }
          }else if(g.st(edgeLast.x,edgeLast.y)===UNKNOWN){ edgeLast=null; p=null; }
          else{
            if(R.maybe(P.Rarely)) lastEdge=R.between(0,3);        // ときどき別の辺へ飛ぶ
            const L=edgeLast;
            if(lastEdge===0)      p=pos(L.x===1?2:1,  L.y+1>N?1:L.y+1);   // 左の辺
            else if(lastEdge===2) p=pos(L.x===N?N-1:N, L.y-1<1?1:L.y-1);  // 右の辺
            else if(lastEdge===1) p=pos(L.x+1>N?1:L.x+1, L.y===1?2:1);    // 上の辺
            else                  p=pos(L.x-1<1?N:L.x-1, L.y===N?N-1:N);  // 下の辺
          }
        }else p=Base.shootRandom(g);
        if(Base.isLegal(g,p)) break;
      }
      edgeLast=p; return p;
    };
    // 前に当てた所の隣は、狙っている最中でなければ避ける（VBA: AvoidAdjacentHitPosition）
    const avoidAdj=(g,p)=>{
      if(g.hasDamagedShip(p.x,p.y)) return true;
      if(R.maybe(P.AlmostNever)) return true;
      return ![[-1,0],[1,0],[0,-1],[0,1]].some(([dx,dy])=>g.st(p.x+dx,p.y+dy)===HIT);
    };
    ai.play=g=>{
      for(let i=0;i<LOOP_MAX;i++){
        const a=g.findHitArea();
        let p;
        if(a) p=Base.destroyTarget(g,a);
        else if(R.maybe(P.AlmostNever)) p=Base.shootRandom(g);
        else if(R.maybe(P.Sometimes)) p=scanCenter(g);
        else p=scanEdges(g);
        if(Base.isLegal(g,p) && Base.shipFits(g,p,g.smallestShipSize()) && avoidAdj(g,p)) return p;
      }
      return Base.shootRandom(g);
    };
  }
  return ai;
}

/* ---- 音（PC版と同じ合成音。スマホ版はファイルを探さない） ---- */
const SND={on:true, vol:0.7, files:{}, ctx:null, log:[]};
function play(name, quiet){
  if(!SND.on) return;
  const vol=Math.max(0, Math.min(1, SND.vol*(quiet?0.6:1)));
  if(vol<=0) return;
  const src = SND.files[name] ? 'file' : 'synth';
  SND.log.push({name, src, quiet:!!quiet}); if(SND.log.length>60) SND.log.shift();
  if(src==='file'){
    const a=new Audio(SND.files[name]); a.volume=vol;
    a.play().catch(()=>synth(name, vol));           // 鳴らせなければ合成音で代わりに
    return;
  }
  synth(name, vol);
}
function actx(){
  if(!SND.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SND.ctx=new C(); }
  if(SND.ctx.state==='suspended') SND.ctx.resume();
  return SND.ctx;
}
function noiseBuf(ctx, sec){
  const b=ctx.createBuffer(1, Math.floor(ctx.sampleRate*sec), ctx.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
/* ざー（雑音）を、フィルタの周波数を動かしながら鳴らす */
function burst(ctx, out, t, dur, f0, f1, type, peak){
  const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx, dur);
  const f=ctx.createBiquadFilter(); f.type=type||'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f); f.connect(g); g.connect(out); src.start(t); src.stop(t+dur);
}
/* ぼん（音程が下がる音） */
function tone(ctx, out, t, dur, f0, f1, type, peak){
  const o=ctx.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.02);
}
function synth(name, vol){
  const ctx=actx(); if(!ctx) return;
  const out=ctx.createGain(); out.gain.value=vol; out.connect(ctx.destination);
  const t=ctx.currentTime+0.01;
  if(name==='miss'){                                   // 水しぶき
    burst(ctx,out,t,0.45,2500,500,'bandpass',0.9);
    tone(ctx,out,t,0.18,700,180,'sine',0.35);
  }else if(name==='hit'){                              // 爆発
    burst(ctx,out,t,0.7,2200,150,'lowpass',1.0);
    tone(ctx,out,t,0.35,140,40,'sine',0.9);
  }else if(name==='sunk'){                             // 大爆発と沈む轟音
    burst(ctx,out,t,1.2,1800,60,'lowpass',1.0);
    tone(ctx,out,t,0.5,120,35,'sine',1.0);
    burst(ctx,out,t+0.3,1.4,900,50,'lowpass',0.8);
    tone(ctx,out,t+0.3,1.6,70,30,'triangle',0.6);
  }else if(name==='win'){                              // ファンファーレ
    [[523,0,.13],[659,.13,.13],[784,.26,.13],[1047,.39,.55]].forEach(([f,d,l])=>
      tone(ctx,out,t+d,l,f,f,'square',0.18));
  }else if(name==='lose'){                             // 下がっていく音
    [[392,0,.35],[330,.35,.35],[262,.7,.9]].forEach(([f,d,l])=>
      tone(ctx,out,t+d,l,f,f*0.97,'triangle',0.45));
  }
}


/* ---- ［画像］表示 ---- */
let THEME='std';
const SPRITE={carrier:'Carrier', battleship:'Battleship', submarine:'Submarine', cruiser:'Cruiser', destroyer:'Destroyer'};
function spriteCss(el, s, x, y){
  const cell=el.offsetWidth || 30;
  const i = s.dir===H ? x-s.x : y-s.y;
  const url='images/'+SPRITE[s.kind]+'32'+s.dir+'.gif';
  const size = s.dir===H ? (s.size*cell)+'px '+cell+'px' : cell+'px '+(s.size*cell)+'px';
  const at   = s.dir===H ? (-i*cell)+'px 0' : '0 '+(-i*cell)+'px';
  return 'url("'+url+'") '+at+' / '+size+' no-repeat, rgba(10,40,70,.42)';
}
function setTheme(t){
  THEME = t==='img' ? 'img' : 'std';
  document.body.classList.toggle('theme-img', THEME==='img');

}
function splash(result){

const G={phase:'idle', human:1, ai:null, grids:{1:null,2:null}, placeIdx:0, preview:null, aim:null,

         timers:[], started:null, logN:0};
const aiId=()=>3-G.human;
const whoName=id=>id===G.human ? 'あなた' : '相手（'+G.ai.name+'）';

/* ---- 描画 ---- */
function buildGrid(id){
  const el=document.createElement('div'); el.className='grid'; el.id='grid'+id;
  let h='<div class="lb top"></div>';
  for(let x=1;x<=N;x++) h+='<div class="lb top">'+COLS[x-1]+'</div>';
  for(let y=1;y<=N;y++){
    h+='<div class="lb">'+y+'</div>';
    for(let x=1;x<=N;x++) h+='<div class="c" data-x="'+x+'" data-y="'+y+'" id="c'+id+'_'+x+'_'+y+'"></div>';
  }
  el.innerHTML=h; return el;
}
function bigId(){   // 大きく見せる盤
  if(G.phase==='place' || G.phase==='idle') return G.human;
  if(G.phase==='over') return aiId();
  return G.view==='own' ? G.human : aiId();
}
function previewCells(){
  if(G.phase!=='place' || !G.preview) return null;
  const d=curShip(), g=G.grids[G.human], p=G.preview;
  return {ok:g.canAdd(p.x,p.y,p.dir,d.size), cells:g.cellsOf(p.x,p.y,p.dir,d.size)};
}
function render(){
  const big=bigId(), small=3-big;
  if($('grid'+big).parentNode!==$('bigSlot')){ $('bigSlot').appendChild($('grid'+big)); $('smallSlot').appendChild($('grid'+small)); }
  const pv=previewCells(), over=G.phase==='over';
  for(const id of [1,2]){
    const g=G.grids[id], mine=id===G.human;
    for(let x=1;x<=N;x++) for(let y=1;y<=N;y++){
      const el=$('c'+id+'_'+x+'_'+y);
      if(!g){ el.className='c'; el.style.background=''; continue; }
      const s=g.shipAt(x,y), st=g.st(x,y), cls=['c'];
      if(s && mine) cls.push('ship');
      if(s && !mine && over && !g.isSunk(s)) cls.push('reveal');
      if(st===MISS) cls.push('miss');
      if(st===HIT){ cls.push('hit'); if(s && g.isSunk(s)) cls.push('sunk'); }
      const L=G.last[3-id]; if(L && L.x===x && L.y===y) cls.push('last');
      if(!mine && G.aim && G.aim.x===x && G.aim.y===y) cls.push('aim');
      el.className=cls.join(' ');
      const showSprite = THEME==='img' && s && (mine || g.isSunk(s) || over);
      el.style.background = showSprite ? spriteCss(el, s, x, y) : '';
    }
    if(pv && mine) pv.cells.forEach(c=>{ const el=$('c'+id+'_'+c.x+'_'+c.y); if(el){ el.classList.add('pv'); if(!pv.ok) el.classList.add('ng'); } });
  }
  const t=id=>(id===G.human?'自分の盤':'相手の盤')+'（グリッド'+id+'）';
  $('bigTitle').textContent = G.grids[1] ? t(big) : 'グリッド';
  $('bigWho').textContent = !G.grids[1] ? '' : big===G.human ? '' : '相手：'+G.ai.name;
  $('smallTitle').textContent = G.grids[1] ? t(small) : '';
  $('fleets').innerHTML = G.grids[1] ? fleetHtml(aiId())+fleetHtml(G.human) : '';
  guide(); acts(); fitBoard();
}
function fleetHtml(id){
  const g=G.grids[id], mine=id===G.human;
  let h='<div class="fleet"><h3>'+(mine?'自分の艦隊':'撃沈した相手の艦')+'</h3><ul>';
  SHIPS.forEach((d,i)=>{
    const s=g.ships.find(v=>v.kind===d.kind); let cls='', pips='';
    if(mine){
      if(!s){ cls=(G.phase==='place'&&i===G.placeIdx)?'now':'todo'; pips='<i class="u"></i>'.repeat(d.size); }
      else { cls=g.isSunk(s)?'sunk':''; pips=s.cells.map(c=>'<i'+(c.hit?' class="h"':'')+'></i>').join(''); }
    }else{
      const sunk=s&&g.isSunk(s); cls=sunk?'sunk':'todo';
      pips=(sunk?'<i class="h"></i>':'<i class="u"></i>').repeat(d.size);
    }
    h+='<li class="'+cls+'"><span class="nm">'+esc(d.name)+'</span><span class="pips">'+pips+'</span></li>';
  });
  return h+'</ul></div>';
}
function guide(){
  const g=$('guide'); g.className=''; let a='', b='';
  if(G.phase==='idle'){ a='⚙で相手を選んで［新しく始める］を押してください'; }
  else if(G.phase==='place'){
    const d=curShip(); a='配置：'+d.name+'（'+d.size+'マス）を置いてください';
    b='自分の盤をタップで仮置き →［回転］→［確定］。置く場所は艦の左端（縦なら上端）です';
  }else if(G.phase==='play'){
    if(G.turn===G.human && !G.busy){
      a = G.aim ? COLS[G.aim.x-1]+G.aim.y+' を狙っています。［撃つ］で発射' : 'あなたの番：相手の盤をタップして狙ってください';
      b='あなた '+G.shots[G.human]+'発（命中 '+G.hits[G.human]+'）／相手 '+G.shots[aiId()]+'発（命中 '+G.hits[aiId()]+'）';
    }else if(G.turn===G.human){ a='…'; }
    else{ a='相手（'+G.ai.name+'）が狙いを定めています…'; g.className='warn'; }
  }else if(G.phase==='over'){
    const win=G.winner===G.human;
    if(win){ a='勝ちました！（'+G.shots[G.human]+'発）'; g.className='win';
      b='命中率 '+Math.round(G.hits[G.human]*100/Math.max(1,G.shots[G.human]))+'%'; }
    else{ a='負けました…（相手 '+G.shots[aiId()]+'発）'; g.className='lose';
      b='見つけられなかった艦を灰色で表示しています'; }
  }
  g.innerHTML=esc(a)+(b?'<span id="guideSub">'+esc(b)+'</span>':'');
}
/* 大きい盤の大きさ：幅いっぱいを基本に、「撃沈した相手の艦」の欄の下端が
   下の操作帯に隠れない大きさまで縮める（スクロールしなくても見えるように。v1.0.1） */
let FIT_KEY='';
function fitBoard(){
  const slot=$('bigSlot'), fl=$('fleets');
  // 幅いっぱい（412px で約37px）より一回り小さい 34px を上限にする（v1.0.1 のご要望）
  const maxCell=Math.min(34, Math.floor((Math.min(innerWidth,560)-16-20)/10));
  const key=innerWidth+'x'+innerHeight+'/'+(fl.firstChild?1:0);
  if(key===FIT_KEY) return; FIT_KEY=key;
  let cell=maxCell;
  slot.style.setProperty('--cell', cell+'px');
  if(!fl.firstChild) return;
  // 測って縮める、を収まるまで（最大4回）。1回目で読みきれないことがあるため
  for(let i=0;i<4;i++){
    const actsTop=innerHeight-$('acts').offsetHeight;
    const bottom=fl.getBoundingClientRect().bottom+window.scrollY;   // いちばん上から見たときの位置
    const over=Math.ceil(bottom - actsTop + 6);
    if(over<=0 || cell<=22) break;
    cell=Math.max(22, cell-Math.max(1, Math.ceil(over/10)));
    slot.style.setProperty('--cell', cell+'px');
  }
}
addEventListener('resize', ()=>{ FIT_KEY=''; requestAnimationFrame(fitBoard); });

/* 下の操作帯：その場面で押せるものだけを出す */
function acts(){
  const box=$('actsIn'); let h='';
  if(G.phase==='idle' || G.phase==='over'){
    h='<button class="primary" data-a="new">'+(G.phase==='over'?'もう一度':'新しく始める')+'</button>';
  }else if(G.phase==='place'){
    const pv=previewCells();
    h='<button data-a="rot">回転</button>'
     +'<button class="primary" data-a="ok"'+(pv&&pv.ok?'':' disabled')+'>確定</button>'
     +'<button data-a="auto">おまかせ</button>'
     +(G.placeIdx>0?'<button data-a="reset">置き直す</button>':'');
  }else{
    const can=G.turn===G.human && !G.busy && !!G.aim;
    h='<button class="primary" data-a="fire"'+(can?'':' disabled')+'>'
      +(G.aim && G.turn===G.human ? COLS[G.aim.x-1]+G.aim.y+' を撃つ' : '撃つ')+'</button>';
  }
  box.innerHTML=h;
}

  if(!pv.ok){ toast('そこには置けません（はみ出すか重なります）'); return; }

  log(d.name+'を '+label(p)+'（'+(p.dir===H?'横':'縦')+'）に配置');
  G.placeIdx++; G.preview=null;
  if(G.placeIdx>=SHIPS.length) startPlay(); else render();
}
function autoPlace(){
  const g=G.grids[G.human];
  for(; G.placeIdx<SHIPS.length; G.placeIdx++){
    const d=curShip(); let p, n=0;
    do{ p=Base.placeShip(g,d.size); n++; } while(g.hasAdjacentShip(p.x,p.y,p.dir,d.size) && n<LOOP_MAX);
    g.add(d,p.x,p.y,p.dir);
  }
  log('残りの艦をおまかせで配置'); G.preview=null; startPlay();
}
function resetPlace(){ G.grids[G.human]=new Grid(G.human); G.placeIdx=0; G.preview=null; log('配置をやり直します'); render(); }
function startPlay(){
  G.phase='play'; G.turn=1; G.aim=null;
  recShips();
  log('全艦の配置が終わりました。グリッド1（'+whoName(1)+'）から攻撃します','sys');
  if(G.turn===G.human){ G.view='enemy'; render(); }
  else{ G.view='own'; render(); aiTurn(); }
}

/* ---- 攻撃 ---- */
function fire(shooter, p){
  recShot(shooter, p);
  const target=G.grids[3-shooter], r=target.tryHit(p.x,p.y);
  G.shots[shooter]++; G.last[shooter]=p; G.aim=null;
  const who=whoName(shooter);
  if(r.result==='miss') log(who+'：'+label(p)+' はずれ');
  else{
    G.hits[shooter]++;
    if(r.result==='sunk') log(who+'：'+label(p)+' 命中 … '+r.ship.name+'を撃沈！','sunk');
    else log(who+'：'+label(p)+' 命中'+(shooter!==G.human?'（'+r.ship.name+'）':''),'hit');
  }
  render(); splash(r.result); play(r.result, shooter!==G.human);
  if(target.allSunk()){ gameOver(shooter); return; }
  G.turn=3-shooter; G.busy=true; render();
  // 結果を見せてから盤を入れ替える
  later(()=>{
    if(G.turn===G.human){ G.busy=false; G.view='enemy'; render(); }
    else { G.view='own'; render(); aiTurn(); }
  }, CFG.view_ms);
}
function aiTurn(){
  G.busy=true;
  later(()=>{ if(G.phase!=='play') return; fire(aiId(), G.ai.play(G.grids[G.human])); }, Math.max(0,+CFG.ai_delay_ms||0));
}
function tapEnemy(x,y){
  if(G.phase!=='play' || G.turn!==G.human || G.busy) return;
  const g=G.grids[aiId()];
  if(g.st(x,y)===HIT || g.st(x,y)===MISS){ toast(COLS[x-1]+y+' はもう撃っています'); return; }
  G.aim={x,y}; render();
}
function gameOver(winner){
  clearTimers(); G.phase='over'; G.winner=winner; G.busy=false;
  const win=winner===G.human;
  log('対戦終了：'+(win?'あなたの勝ち':'相手（'+G.ai.name+'）の勝ち'),'sys');
  addResult(G.ai.kind, win);
  saveGame(win);
  later(()=>play(win?'win':'lose'), 1300);
  render();
}

/* ---- 過去の対戦（v1.1.0）：スマホの中に直近100局 ---- */
const KEY_GAMES='battleship_android_games', GAMES_MAX=100;
function saveGame(win){
  if(!REC) return;
  REC.win=win;
  const a=lsGet(KEY_GAMES, []); a.unshift(REC); a.length=Math.min(a.length, GAMES_MAX);
  lsSet(KEY_GAMES, a); REC=null;
}
function fmtAt(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}

/* ---------------- ⚙ ---------------- */
function segSet(id, v){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===String(v))); }
function openSet(){
  $('selAi').value=CFG.ai; segSet('segGrid', CFG.grid); segSet('segTheme', CFG.theme);
  segSet('segSound', CFG.sound?'1':'0'); $('rngVol').value=CFG.volume; $('volVal').textContent=CFG.volume;
  $('selDelay').value=String(CFG.ai_delay_ms); showStats(); $('mSet').classList.add('on');
}
function applySound(){ SND.on=!!CFG.sound; SND.vol=Math.max(0,Math.min(100,+CFG.volume))/100; }

/* ---------------- 結び付け（読み込み直後） ---------------- */
function bind(){
  $('bigSlot').appendChild(buildGrid(1)); $('smallSlot').appendChild(buildGrid(2));
  document.addEventListener('click', e=>{
    const c=e.target.closest('#bigSlot .c');
    if(c){
      const id=+c.id.split('_')[0].slice(1), x=+c.dataset.x, y=+c.dataset.y;
      if(G.phase==='place' && id===G.human) placeAt(x,y);
      else if(G.phase==='play' && id!==G.human) tapEnemy(x,y);
      return;
    }
    const b=e.target.closest('#actsIn button'); if(!b || b.disabled) return;
    actx && SND.on && actx();                    // スマホは最初のタップで音を使えるようにする
    const a=b.dataset.a;
    if(a==='new') newGame();
    else if(a==='rot') rotate();
    else if(a==='ok') confirmPlace();
    else if(a==='auto') autoPlace();
    else if(a==='reset') resetPlace();
    else if(a==='fire' && G.aim){ const p=G.aim; fire(G.human, p); }
  });
  $('bSet').onclick=openSet;
  $('bClose').onclick=()=>$('mSet').classList.remove('on');
  $('mSet').addEventListener('click', e=>{ if(e.target===$('mSet')) $('mSet').classList.remove('on'); });
  $('bNew2').onclick=()=>{
    if(G.phase==='play' && !confirm('いまの対戦をやめて、はじめからにしますか？')) return;
    $('mSet').classList.remove('on'); newGame();
  };
  $('selAi').onchange=()=>{ CFG.ai=$('selAi').value; savePrefs(); showStats(); };
  $('selDelay').onchange=()=>{ CFG.ai_delay_ms=+$('selDelay').value; savePrefs(); };
  document.querySelectorAll('#segGrid button').forEach(b=>b.onclick=()=>{ CFG.grid=b.dataset.v; segSet('segGrid',CFG.grid); savePrefs(); });
  document.querySelectorAll('#segTheme button').forEach(b=>b.onclick=()=>{ CFG.theme=b.dataset.v; segSet('segTheme',CFG.theme); setTheme(CFG.theme); savePrefs(); });
  document.querySelectorAll('#segSound button').forEach(b=>b.onclick=()=>{
    CFG.sound=b.dataset.v==='1'; segSet('segSound',b.dataset.v); applySound(); savePrefs(); if(CFG.sound) play('miss'); });
  $('rngVol').oninput=()=>{ CFG.volume=+$('rngVol').value; $('volVal').textContent=CFG.volume; applySound(); };
  $('rngVol').onchange=()=>{ savePrefs(); play('hit'); };
  $('bClear').onclick=()=>{ if(!confirm('戦績をすべて消しますか？（過去の対戦の記録も消えます）')) return;
    lsSet(KEY_STATS,{}); lsSet(KEY_GAMES,[]); showStats(); toast('戦績を消しました'); };
  $('bHistory').onclick=()=>{
    $('mSet').classList.remove('on');
    RP.open(lsGet(KEY_GAMES, []).map(r=>({win:!!r.win,
      title:fmtAt(r.at)+'　対 '+(AI_NAMES[r.ai]||r.ai),
      sub:'グリッド'+r.human+(r.human===1?'（先攻）':'（後攻）')+'　全 '+r.shots.length+' 手',
      load:async()=>r})));
  };
}

/* ======================================================================
   対戦の記録と再生（PC版 v1.3.0 ／ スマホ版 v1.1.0 で共通の部品）
     記録：1局ごとに JSON 1つ
       {v:1, ai, human, at, ships:{1:[{kind,x,y,dir}…],2:[…]}, shots:[[撃った側,x,y]…], win}
     再生：記録から盤を作り直し、n 手目まで撃ち直して見せる（ゲームの Grid をそのまま使う）
     画面：RP.open(一覧) で窓を出す。一覧は [{title, sub, load: async()=>記録}]
   ====================================================================== */
let REC=null;
function recStart(){
  REC={v:1, ai:G.ai.kind, human:G.human, at:new Date().toISOString(), ships:{1:[],2:[]}, shots:[], win:null};
}
function recShips(){
  if(!REC) return;
  for(const id of [1,2]) REC.ships[id]=G.grids[id].ships.map(s=>({kind:s.kind,x:s.x,y:s.y,dir:s.dir}));
}
function recShot(shooter, p){ if(REC) REC.shots.push([shooter,p.x,p.y]); }

function replayState(rec, n){
  const gs={1:new Grid(1), 2:new Grid(2)};
  for(const id of [1,2]) (rec.ships[id]||[]).forEach(s=>
    gs[id].add(SHIPS.find(d=>d.kind===s.kind), s.x, s.y, s.dir));
  let last=null;
  for(let i=0; i<n && i<rec.shots.length; i++){
    const [sh,x,y]=rec.shots[i];
    const r=gs[3-sh].tryHit(x,y);
    last={sh, x, y, result:r.result, ship:r.ship};
  }
  return {gs, last};
}

const RP={rec:null, n:0, timer:null, list:[]};
(function(){
  const css=`
#mReplay{position:fixed;inset:0;z-index:55;background:rgba(36,31,20,.45);display:none;
  align-items:center;justify-content:center;padding:8px}
#mReplay.on{display:flex}
#mReplay .rp{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.3);width:760px;max-width:100%;max-height:calc(100vh - 16px);
  display:flex;flex-direction:column;overflow:hidden}
#mReplay .rp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2)}
#mReplay .rp-head b{color:var(--navy);font-size:15px}
#mReplay .rp-head .sp{flex:1}
#mReplay .rp-body{flex:1;overflow:auto;padding:10px 14px}
#mReplay .rp-list{list-style:none;margin:0;padding:0}
#mReplay .rp-list li{display:flex;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line2);cursor:pointer}
#mReplay .rp-list li:hover{background:#fff}
#mReplay .rp-list .w{font-weight:700;width:3em}
#mReplay .rp-list .w.win{color:var(--ok,#2C6E3F)} #mReplay .rp-list .w.lose{color:var(--err,#A22C2C)}
#mReplay .rp-list .s{color:var(--sub);font-size:12px}
#mReplay .rp-list li.none{cursor:default;color:var(--sub)}
#mReplay .rp-boards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#mReplay .rp-b h4{margin:0 0 4px;font-size:12.5px}
#mReplay .rp-g{--rc:min(26px, calc((min(100vw, 760px) - 90px) / 20));display:grid;
  grid-template-columns:14px repeat(10,var(--rc));grid-template-rows:14px repeat(10,var(--rc))}
#mReplay .rp-g i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;color:var(--sub)}
#mReplay .rp-g b{background:var(--sea);border:1px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--rc) * .55);line-height:1}
#mReplay .rp-g b.sh{background:var(--ship)}
#mReplay .rp-g b.ms::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--miss)}
#mReplay .rp-g b.ht{background:#8E4A43;color:#fff} #mReplay .rp-g b.ht::after{content:"×"}
#mReplay .rp-g b.sk{background:#5A1F1A;color:#F3C9C3}
#mReplay .rp-g b.lt{box-shadow:inset 0 0 0 3px #F0B400}
#mReplay .rp-cap{margin:10px 0 6px;font-weight:700;color:var(--navy);min-height:1.5em;text-align:center}
#mReplay .rp-ctl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
#mReplay .rp-ctl button{min-width:44px;min-height:38px;border:1px solid var(--line);border-radius:7px;background:#fff}
#mReplay .rp-ctl button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#mReplay .rp-ctl input{width:100%;margin-top:6px}
#mReplay .rp-ctl select{min-height:38px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 6px}
#mReplay .rp-foot{padding:10px 14px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
#mReplay .rp-foot button{min-height:38px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 14px}`;
  const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);
  const m=document.createElement('div'); m.id='mReplay';
  m.innerHTML=`<div class="rp">
    <div class="rp-head"><b id="rpTitle">過去の対戦</b><span class="sp"></span>
      <button id="rpBack" hidden>一覧へ</button></div>
    <div class="rp-body">
      <ul class="rp-list" id="rpList"></ul>
      <div id="rpView" hidden>
        <div class="rp-boards"><div class="rp-b"><h4 id="rpH1"></h4><div class="rp-g" id="rpG1"></div></div>
          <div class="rp-b"><h4 id="rpH2"></h4><div class="rp-g" id="rpG2"></div></div></div>
        <div class="rp-cap" id="rpCap"></div>
        <div class="rp-ctl">
          <button data-rp="first" title="最初">⏮</button><button data-rp="prev" title="1手戻る">◀</button>
          <button data-rp="play" id="rpPlay" title="自動で進める">自動再生</button>
          <button data-rp="next" title="1手進む">▶</button><button data-rp="last" title="最後">⏭</button>
          <select id="rpSpeed" title="自動再生の速さ（1手あたり）">
            <option value="3000">とてもゆっくり（3秒）</option><option value="2000">ゆっくり（2秒）</option>
            <option value="1000">ふつう（1秒）</option><option value="500">速め（0.5秒）</option>
          </select>
          <input type="range" id="rpRange" min="0" value="0">
        </div>
      </div>
    </div>
    <div class="rp-foot"><button id="rpClose">閉じる</button></div></div>`;
  document.body.appendChild(m);
  const grid=id=>{ let h='<i></i>'; for(let x=1;x<=N;x++) h+='<i>'+COLS[x-1]+'</i>';
    for(let y=1;y<=N;y++){ h+='<i>'+y+'</i>'; for(let x=1;x<=N;x++) h+='<b id="rp'+id+'_'+x+'_'+y+'"></b>'; } return h; };
  document.getElementById('rpG1').innerHTML=grid(1);
  document.getElementById('rpG2').innerHTML=grid(2);
  m.addEventListener('click', e=>{
    if(e.target===m){ RP.close(); return; }
    const li=e.target.closest('#rpList li[data-i]'); if(li){ RP.show(+li.dataset.i); return; }
    const b=e.target.closest('[data-rp]'); if(!b) return;
    const a=b.dataset.rp, L=RP.rec?RP.rec.shots.length:0;
    if(a==='play'){ RP.auto(!RP.timer); return; }
    RP.auto(false);
    RP.go(a==='first'?0 : a==='prev'?RP.n-1 : a==='next'?RP.n+1 : L);
  });
  document.getElementById('rpRange').oninput=e=>{ RP.auto(false); RP.go(+e.target.value); };
  // 自動再生の速さ（v1.3.1／スマホ版 v1.1.1）。選んだものを覚える。再生中に変えてもそのまま続く
  const sp=document.getElementById('rpSpeed');
  try{ const v=localStorage.getItem('battleship_replay_speed'); if(v && sp.querySelector('option[value="'+v+'"]')) sp.value=v; else sp.value='1000'; }
  catch(e){ sp.value='1000'; }
  sp.onchange=()=>{ try{ localStorage.setItem('battleship_replay_speed', sp.value); }catch(e){}
    if(RP.timer) RP.auto(true, true); };
  document.getElementById('rpClose').onclick=()=>RP.close();
  document.getElementById('rpBack').onclick=()=>RP.listView();
})();

RP.open=function(list){
  RP.list=list||[];
  document.getElementById('mReplay').classList.add('on');
  RP.listView();
};
RP.close=function(){ RP.auto(false); document.getElementById('mReplay').classList.remove('on'); };
RP.listView=function(){
  RP.auto(false); RP.rec=null;
  document.getElementById('rpTitle').textContent='過去の対戦（'+RP.list.length+'局）';
  document.getElementById('rpBack').hidden=true;
  document.getElementById('rpView').hidden=true;
  const ul=document.getElementById('rpList'); ul.hidden=false;
  ul.innerHTML = RP.list.length ? RP.list.map((it,i)=>
      '<li data-i="'+i+'"><span class="w '+(it.win?'win':'lose')+'">'+(it.win?'勝ち':'負け')+'</span>'
      +'<span>'+esc(it.title)+'<br><span class="s">'+esc(it.sub||'')+'</span></span></li>').join('')
    : '<li class="none">まだ記録がありません。1局最後まで戦うと、ここに残ります（v1.3.0／スマホ版 v1.1.0 から）。</li>';
};
RP.show=async function(i){
  const it=RP.list[i]; if(!it) return;
  let rec=null;
  try{ rec=await it.load(); }catch(e){ rec=null; }
  if(!rec || !rec.shots){ toast('この対戦は配置と手順を記録していません（古い版の対戦です）'); return; }
  RP.rec=rec;
  document.getElementById('rpTitle').textContent=it.title;
  document.getElementById('rpBack').hidden=false;
  document.getElementById('rpList').hidden=true;
  document.getElementById('rpView').hidden=false;
  const who=id=>(id===rec.human?'あなた':'相手（'+(AI_NAMES[rec.ai]||rec.ai)+'）')+'（グリッド'+id+(id===1?'・先攻':'・後攻')+'）';
  document.getElementById('rpH1').textContent=who(1);
  document.getElementById('rpH2').textContent=who(2);
  const r=document.getElementById('rpRange'); r.max=rec.shots.length;
  RP.go(0);
};
RP.go=function(n){
  const rec=RP.rec; if(!rec) return;
  n=Math.max(0, Math.min(rec.shots.length, n)); RP.n=n;
  const {gs,last}=replayState(rec, n);
  for(const id of [1,2]){
    const g=gs[id];
    for(let x=1;x<=N;x++) for(let y=1;y<=N;y++){
      const el=document.getElementById('rp'+id+'_'+x+'_'+y), s=g.shipAt(x,y), st=g.st(x,y);
      let c=s?'sh':'';
      if(st===MISS) c='ms';
      if(st===HIT) c = (s && g.isSunk(s)) ? 'ht sk' : 'ht';
      if(last && 3-last.sh===id && last.x===x && last.y===y) c+=' lt';
      el.className=c;
    }
  }
  document.getElementById('rpRange').value=n;
  const L=rec.shots.length;
  let cap;
  if(!last) cap='0 / '+L+' 手：配置のようす（両方の艦を見せています）';
  else{
    const w=last.sh===rec.human?'あなた':'相手';
    const res = last.result==='miss' ? 'はずれ' : last.result==='sunk' ? '命中 … '+last.ship.name+'を撃沈！' : '命中（'+last.ship.name+'）';
    cap=n+' / '+L+' 手：'+w+' → '+COLS[last.x-1]+last.y+' '+res;
    if(n===L) cap+='　【'+(rec.win?'あなたの勝ち':'相手の勝ち')+'】';
  }
  document.getElementById('rpCap').textContent=cap;
};
RP.speed=function(){ return Math.max(100, +document.getElementById('rpSpeed').value || 1000); };
RP.auto=function(on, keep){
  clearInterval(RP.timer); RP.timer=null;
  const b=document.getElementById('rpPlay');
  if(on && RP.rec){
    if(!keep && RP.n>=RP.rec.shots.length) RP.go(0);
    RP.timer=setInterval(()=>{ if(RP.n>=RP.rec.shots.length){ RP.auto(false); return; } RP.go(RP.n+1); }, RP.speed());
  }
  if(b){ b.classList.toggle('on', !!RP.timer); b.textContent=RP.timer?'止める':'自動再生'; }
};

bind();
loadPrefs(); applySound();
$('ver').textContent='v'+APP_VERSION; $('ver2').textContent='v'+APP_VERSION;
showStats(); setTheme(CFG.theme);

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
